name: Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: backend

jobs:
  checks:
    name: Go checks and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: edm_test
          POSTGRES_USER: edm
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edm -d edm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Disposable local service only; no deployment credentials are used.
      TEST_DATABASE_URL: postgres://edm:ci-test-password@127.0.0.1:5432/edm_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests with race detector
        run: go test -race -count=1 -timeout=5m ./...

  build:
    name: Build Linux amd64 artifacts
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and package
        run: |
          mkdir -p dist
          go build -trimpath -o dist/api ./cmd/api
          go build -trimpath -o dist/edmctl ./cmd/edmctl
          tar -czf backend-linux-amd64.tar.gz -C dist api edmctl
          sha256sum backend-linux-amd64.tar.gz > backend-linux-amd64.tar.gz.sha256
      - name: Upload binaries and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-linux-amd64-${{ github.sha }}
          path: |
            backend/backend-linux-amd64.tar.gz
            backend/backend-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
