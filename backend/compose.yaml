services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: edm
      POSTGRES_USER: edm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the local database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edm -d edm"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
