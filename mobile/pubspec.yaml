name: edm
description: Мобильное согласование документов для ОС Аврора.
organization: ru.auroraos
license: MIT
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.1
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.6
  path: ^1.9.1
  # Resolve these Aurora builds through the OMP registry; see README.md.
  path_provider: 2.1.5+7
  sqflite: 2.4.2+2
  pdfrx: 2.4.8+1
  flutter_secure_storage: 11.2.0+1

# pdfrx pins upstream 0.2.3; use the corresponding Aurora adapter build.
dependency_overrides:
  pdfium_flutter: 0.2.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
